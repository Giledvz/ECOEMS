    <mask id="q5o_h3" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="70">
      <rect x="0" y="0" width="240" height="70" fill="white"/><polygon points="218.38,16.62 218.38,53.38 181.62,53.38 181.62,16.62" fill="black"/></mask>
  </defs>
  <!-- 1: hexágono hueco casi inscrito en círculo relleno -->
